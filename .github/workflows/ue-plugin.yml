name: Unreal plugin sources

on:
  pull_request:
    paths:
      - 'plugins/ue/**'
      - '.github/workflows/ue-plugin.yml'
      - '.gitattributes'
      - 'Makefile'
  push:
    tags: ['ue-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.9'
      - name: Check the plugin tag version
        run: |
          python - <<'PY'
          import json, os, pathlib
          version = json.loads(pathlib.Path('plugins/ue/MHARKitExport.uplugin').read_text())['VersionName']
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/ue-v') and ref.removeprefix('refs/tags/ue-v') != version:
              raise SystemExit('Plugin tag and descriptor version must match')
          PY
      - name: Test the Unreal Python helper and source package
        run: make plugin-test PYTHON=python
      - name: Package Unreal sources
        run: make plugin PYTHON=python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unreal-plugin-sources
          path: plugins/ue/dist/*.zip
          if-no-files-found: error
          retention-days: 14
